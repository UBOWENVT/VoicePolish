# ─────────────────────────────────────────────────────────────────────────────
# VoicePolish — Multi-Service Local Deployment
# ─────────────────────────────────────────────────────────────────────────────
# Two services collapsed onto one host to mirror the production topology
# (Vercel for the frontend + Railway for the dockerized backend).
#
#   nginx    — reverse proxy + static file server  (exposes 8080 to host)
#   backend  — FastAPI on uvicorn                  (NOT exposed to host;
#                                                   only nginx can reach it)
#
# Usage:
#   docker compose up           # build images on first run, start the stack
#   docker compose up -d        # same, detached
#   docker compose logs -f      # follow logs
#   docker compose down         # stop containers (keeps the volume)
#   docker compose down -v      # stop AND wipe the SQLite volume
#
# After `up`, the app is at:  http://localhost:8080
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend           # Dockerfile lives in ./backend/
      dockerfile: Dockerfile
    image: voicepolish-backend:local
    container_name: voicepolish-backend

    # Read API keys from the same .env you already use for local dev.
    env_file:
      - ./backend/.env

    # Override DATABASE_URL to point at the mounted volume — same path
    # ("/data/voicepolish.db") that Railway uses in production, so the
    # local stack exercises the same code path.
    environment:
      DATABASE_URL: "sqlite:////data/voicepolish.db"
      # CORS isn't strictly needed since nginx makes everything same-origin,
      # but we set it explicitly to match production's hardened config.
      ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"

    # Named volume for SQLite. Lives inside Docker's storage, not the repo.
    # `docker compose down -v` wipes it; plain `down` keeps it.
    volumes:
      - voicepolish_data:/data

    # NO `ports:` block here — the backend is NOT directly reachable from the
    # host. The nginx container talks to it over Compose's internal network
    # using the service name "backend" as the DNS hostname.

    restart: unless-stopped


  # ─── Nginx (reverse proxy + static frontend) ────────────────────────────────
  nginx:
    image: nginx:alpine            # public image, no Dockerfile of our own
    container_name: voicepolish-nginx

    ports:
      - "8080:80"                  # host 8080 → container 80

    volumes:
      # Mount the frontend directory read-only into nginx's web root.
      - ./frontend:/usr/share/nginx/html:ro
      # Mount our custom server config. nginx's default config includes any
      # *.conf in /etc/nginx/conf.d/, so dropping default.conf in there
      # replaces the stock "welcome to nginx" config.
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend                    # start backend first (doesn't wait for
                                   # readiness — see README note)

    restart: unless-stopped


# ─── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  voicepolish_data:                # SQLite database file, persists across
                                   # container restarts. Wipe with
                                   # `docker compose down -v`.
