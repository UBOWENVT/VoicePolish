# ─────────────────────────────────────────────────────────────────────────────
# VoicePolish — nginx configuration for local Docker Compose deployment
# ─────────────────────────────────────────────────────────────────────────────
# This nginx container plays two roles that, in production, are handled by
# two separate services:
#
#   1. Static site host (production: Vercel)
#      Serves frontend/VoicePolish.html, mounted at /usr/share/nginx/html
#
#   2. Reverse proxy to the API (production: direct browser → Railway)
#      Forwards /api/* and /health to the backend container on its
#      internal port 8000.
#
# This collapses Vercel + Railway into one local host, so `docker compose up`
# reproduces the full app on a developer machine with one command.
# ─────────────────────────────────────────────────────────────────────────────

server {
    # Inside the container we listen on the standard HTTP port 80.
    # docker-compose.yml maps the host's 8080 to this port.
    listen 80;
    server_name localhost;

    # ─── API reverse proxy ───────────────────────────────────────────────────
    # Any request starting with /api/ is forwarded to the FastAPI backend.
    # "backend" here is the docker-compose service name — Compose's internal
    # DNS resolves it to the backend container's IP on the shared network.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Audio uploads can be a few MB; the default nginx 1m limit would
        # 413 long recordings. 50m matches the kind of payload Whisper
        # actually accepts.
        client_max_body_size 50m;
    }

    # Health endpoint sits at /health (not under /api/) on the FastAPI side,
    # so it needs its own location block.
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ─── Static frontend ─────────────────────────────────────────────────────
    # Everything else falls through to here — the single-file HTML app.
    # try_files makes a deep link like /anything-here serve VoicePolish.html
    # (graceful for any future client-side routing).
    location / {
        root /usr/share/nginx/html;
        index VoicePolish.html;
        try_files $uri $uri/ /VoicePolish.html;
    }
}
