# Loki configuration — minimal single-binary deployment for the lab.
# Reference: https://grafana.com/docs/loki/latest/configure/
#
# This config:
#   - Runs all Loki components in one process (auth disabled — local-only).
#   - Stores chunks + indexes on disk inside the container (mounted volume).
#   - Uses TSDB schema (current best-practice for new deployments).
#   - Sets retention to 30 days (matches the lab's S3 lifecycle policy).

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn   # don't pollute logs with Loki's own info messages

# Single-binary "common" config — Loki auto-derives ring, replication, etc.
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# TSDB schema (replaces older boltdb-shipper). Single period covering all time.
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Limits — keep the lab tight, fail loudly if something runs away.
limits_config:
  retention_period: 720h   # 30 days
  max_query_series: 5000
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16

# Compactor handles retention enforcement.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

# Disable analytics phone-home (privacy + lab hygiene).
analytics:
  reporting_enabled: false
